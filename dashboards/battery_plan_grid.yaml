# Axpert Battery Planner - compact Sunsynk-style table using core tile cards.
# One row per slot: Enabled | Start time | Target SOC | Grid charge | Charge amps.
# Tapping a time or SOC tile opens its editor; tapping a switch toggles it.
type: vertical-stack
cards:
  - type: grid
    columns: 2
    square: false
    cards:
      - type: tile
        entity: switch.axpert_battery_planner_battery_plan_enabled
        name: Battery plan
        tap_action:
          action: toggle
      - type: tile
        entity: sensor.axpert_battery_planner_plan_execution_status
        name: Status
      - type: tile
        entity: sensor.axpert_battery_planner_active_plan_slot
        name: Active slot
      - type: tile
        entity: sensor.axpert_battery_planner_plan_target_soc
        name: Target SOC
  - type: markdown
    content: >-
      {% set nxt = state_attr('sensor.axpert_battery_planner_active_plan_slot', 'next_slot_change') %}
      **Slot · Start · Target SOC · Grid · Amps** — active slot
      **{{ states('sensor.axpert_battery_planner_active_plan_slot') }}**,
      next change at {{ as_timestamp(nxt) | timestamp_custom('%H:%M') if nxt else 'n/a' }}
  - type: grid
    columns: 5
    square: false
    cards:
      # Slot 1
      - type: tile
        entity: switch.axpert_battery_planner_slot_1_enabled
        name: Slot 1
        tap_action:
          action: toggle
      - type: tile
        entity: time.axpert_battery_planner_slot_1_start_time
        name: Start
      - type: tile
        entity: number.axpert_battery_planner_slot_1_target_soc
        name: SOC
      - type: tile
        entity: switch.axpert_battery_planner_slot_1_grid_charge
        name: Grid
        tap_action:
          action: toggle
      - type: tile
        entity: number.axpert_battery_planner_slot_1_charge_current
        name: Amps
      # Slot 2

# Axpert Battery Planner - core cards only (no custom cards needed).
# Add via: Dashboard > Edit > Add card > Manual, and paste this YAML.
type: vertical-stack
cards:
  - type: tile
    entity: switch.axpert_battery_planner_battery_plan_enabled
    name: Battery plan
    tap_action:
      action: toggle
  - type: grid
    columns: 3
    square: false
    cards:
      - type: tile
        entity: sensor.axpert_battery_planner_plan_execution_status
        name: Status
      - type: tile
        entity: sensor.axpert_battery_planner_active_plan_slot
        name: Active slot
      - type: tile
        entity: sensor.axpert_battery_planner_plan_target_soc
        name: Target SOC
  - type: entities
    title: Battery plan slots
    state_color: true
    entities:
      - type: section
        label: Slot 1
      - entity: switch.axpert_battery_planner_slot_1_enabled
        name: Enabled
      - entity: time.axpert_battery_planner_slot_1_start_time
        name: Start
      - entity: number.axpert_battery_planner_slot_1_target_soc
        name: Target SOC
      - entity: switch.axpert_battery_planner_slot_1_grid_charge
        name: Grid charge
      - type: section
        label: Slot 2
      - entity: switch.axpert_battery_planner_slot_2_enabled
        name: Enabled
      - entity: time.axpert_battery_planner_slot_2_start_time
        name: Start
      - entity: number.axpert_battery_planner_slot_2_target_soc
        name: Target SOC
      - entity: switch.axpert_battery_planner_slot_2_grid_charge
        name: Grid charge
      - type: section
        label: Slot 3
      - entity: switch.axpert_battery_planner_slot_3_enabled
        name: Enabled
      - entity: time.axpert_battery_planner_slot_3_start_time
        name: Start
      - entity: number.axpert_battery_planner_slot_3_target_soc
        name: Target SOC
      - entity: switch.axpert_battery_planner_slot_3_grid_charge
        name: Grid charge
      - type: section
        label: Slot 4
      - entity: switch.axpert_battery_planner_slot_4_enabled
        name: Enabled
      - entity: time.axpert_battery_planner_slot_4_start_time
        name: Start
      - entity: number.axpert_battery_planner_slot_4_target_soc
        name: Target SOC
      - entity: switch.axpert_battery_planner_slot_4_grid_charge
        name: Grid charge
      - type: section
        label: Slot 5
      - entity: switch.axpert_battery_planner_slot_5_enabled
        name: Enabled
      - entity: time.axpert_battery_planner_slot_5_start_time
        name: Start
      - entity: number.axpert_battery_planner_slot_5_target_soc
        name: Target SOC
      - entity: switch.axpert_battery_planner_slot_5_grid_charge
        name: Grid charge
      - type: section
        label: Slot 6
      - entity: switch.axpert_battery_planner_slot_6_enabled
        name: Enabled
      - entity: time.axpert_battery_planner_slot_6_start_time
        name: Start
      - entity: number.axpert_battery_planner_slot_6_target_soc
        name: Target SOC
      - entity: switch.axpert_battery_planner_slot_6_grid_charge
        name: Grid charge
  - type: entities
    title: Diagnostics
    entities:
      - type: attribute
        entity: sensor.axpert_battery_planner_plan_execution_status
        attribute: soc
        name: Planner SOC
        suffix: "%"
      - type: attribute
        entity: sensor.axpert_battery_planner_plan_execution_status
        attribute: desired_output_priority
        name: Desired output priority
      - type: attribute
        entity: sensor.axpert_battery_planner_plan_execution_status
        attribute: desired_charger_priority
        name: Desired charger priority
      - type: attribute
        entity: sensor.axpert_battery_planner_plan_execution_status
        attribute: pending_state
        name: Pending (dwell)
      - type: attribute
        entity: sensor.axpert_battery_planner_active_plan_slot
        attribute: next_slot_change
        name: Next slot change
        format: relative
      - type: attribute
        entity: sensor.axpert_battery_planner_plan_execution_status
        attribute: writes_today
        name: Inverter writes today
      - type: attribute
        entity: sensor.axpert_battery_planner_plan_execution_status
        attribute: last_command
        name: Last command
